- id: CVE-2026-97045
  title: Incomplete ancestor namespace checks in HTML raw-text rendering
  vendor: Google
  product: golang.org/x/net/html (Render)
  severity: ""
  year: 2026
  url: https://pkg.go.dev/vuln/GO-2026-6866
  record_url: https://www.cve.org/CVERecord?id=CVE-2026-97045
  writeup: ""
  summary:
    Incomplete ancestor namespace checks can cause rendered raw text to be reparsed in a
    different foreign namespace, creating a cross-site scripting risk. The fix checks the
    full ancestor chain before emitting literal text.
  affected: golang.org/x/net/html before v0.62.0
  fixed_in: golang.org/x/net v0.62.0
  status: Fixed
  published: "2026-10-27"
