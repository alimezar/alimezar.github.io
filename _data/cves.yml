# CVE records (cveawg.mitre.org) or the vendor advisory, not from memory.
# Order is manual: the Go html/template XSS is pinned first while it waits for a
# rating, the rest run Critical down to Low, embargoed entries at the very bottom.
# Fields: id, title, vendor, product, severity, year, url, writeup, pending
#   severity - Critical | High | Medium | Low, or empty when nobody has rated it
#   pending  - true for reserved IDs with no public record yet (renders muted,
#              leave url empty so the ID is not linked anywhere)
# ---------------------------------------------------------------------------

