<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home"><span class="brand-mark" aria-hidden="true">as.</span><span>{{ site.title }}</span></a>
    <nav class="site-nav" aria-label="Primary">
      {%- assign p = page.url -%}
      <a href="{{ '/research/' | relative_url }}"{% if p contains '/research' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/cves/' | relative_url }}"{% if p contains '/cves' %} aria-current="page"{% endif %}>CVEs</a>
      <a href="{{ '/tooling/' | relative_url }}"{% if p contains '/tooling' %} aria-current="page"{% endif %}>Tooling</a>
      <a href="{{ '/hall-of-fame/' | relative_url }}"{% if p contains '/hall-of-fame' %} aria-current="page"{% endif %}>Recognition</a>
      <a href="{{ '/about/' | relative_url }}"{% if p contains '/about' %} aria-current="page"{% endif %}>About</a>
      <a class="nav-external" href="https://github.com/{{ site.github_username }}" rel="me noopener" target="_blank">GitHub <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
    </nav>
  </div>
</header>
